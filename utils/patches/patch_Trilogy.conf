
# EQEMu Trilogy (EverQuest v29c/v30, build "8-09-2001 14:25") opcode mappings.
# All hex values verified against EQClassic/Common/Include/eq_opcodes.h.
# Format: OP_InternalName=0xHEXVALUE

OP_Unknown=0x0000
OP_ExploreUnknown=0x0000        # used for unknown explorer

# -------------------------------------------------------------------------
# World server opcodes
# -------------------------------------------------------------------------
OP_SendLoginInfo=0x5818         # WS_SEND_LOGIN_INFO
OP_SendCharInfo=0x4720          # WS_SEND_CHAR_INFO / OP_SendCharInfo
OP_ExpansionInfo=0xd821         # OP_ExpansionInfo
OP_DeleteCharacter=0x5a20       # OP_DeleteCharacter
OP_CharacterCreate=0x4920       # OP_CharacterCreate
OP_ApproveName=0x8b20           # OP_NAMEAPPROVAL (server approval response)
OP_EnterWorld=0x0180            # OP_ENTERWORLD (client -> world after char select)
OP_ZoneServerInfo=0x0480        # OP_ZoneServerInfo
OP_PostEnterWorld=0x0000        # no Trilogy equivalent — suppress
OP_WorldComplete=0x0000         # no Trilogy equivalent — suppress
OP_ApproveWorld=0x0000          # no Trilogy equivalent — suppress
OP_MOTD=0x0000                  # no Trilogy equivalent — suppress

# -------------------------------------------------------------------------
# Zone entry / session opcodes
# -------------------------------------------------------------------------
OP_AckPacket=0x0019             # Low-level session ACK (Daybreak layer)
OP_ZoneEntry=0x2a20             # OP_ZoneEntry (both directions)
OP_PlayerProfile=0x2d20         # OP_PlayerProfile
OP_NewZone=0x5b20               # OP_NewZone
OP_NewSpawn=0x4921              # OP_NewSpawn
OP_ZoneSpawns=0x6121            # OP_ZoneSpawns
OP_DeleteSpawn=0x2b20           # OP_DeleteSpawn
OP_ZoneChange=0xa320            # OP_ZoneChange
OP_ReqNewZone=0x0000            # no Trilogy equivalent
OP_ReqClientSpawn=0x0000        # no Trilogy equivalent

# -------------------------------------------------------------------------
# Movement / position
# -------------------------------------------------------------------------
OP_ClientUpdate=0xf320          # OP_ClientUpdate (both directions)
OP_MobUpdate=0xa120             # OP_MobUpdate
OP_SpawnAppearance=0xf520       # OP_SpawnAppearance

# -------------------------------------------------------------------------
# Appearance / equipment
# -------------------------------------------------------------------------
OP_WearChange=0x9220            # OP_WearChange

# -------------------------------------------------------------------------
# Chat / messaging
# -------------------------------------------------------------------------
OP_ChannelMessage=0x0721        # OP_ChannelMessage (both directions)
OP_SpecialMesg=0x8021           # OP_SpecialMesg

# -------------------------------------------------------------------------
# Combat
# -------------------------------------------------------------------------
OP_Action=0x5820                # OP_Action (combat actions, damage notifications)
OP_Damage=0x5820                # maps to same Action struct in Trilogy
OP_Death=0x4a20                 # OP_Death
OP_AutoAttack=0x5121            # OP_AutoAttack (client auto-attack toggle)

# -------------------------------------------------------------------------
# HP / Mana / Buffs
# -------------------------------------------------------------------------
OP_HPUpdate=0xb220              # OP_HPUpdate
OP_ManaChange=0x7f21            # OP_ManaChange
OP_Buff=0x3221                  # OP_Buff

# -------------------------------------------------------------------------
# Spells
# -------------------------------------------------------------------------
OP_CastSpell=0x7e21             # OP_CastSpell (client -> server)
OP_BeginCast=0xa920             # OP_BeginCast (both directions)
OP_MemorizeSpell=0x8221         # OP_MemorizeSpell (both directions)
OP_LoadSpellSet=0x0000          # no direct Trilogy equivalent; use OP_MemorizeSpell instead

# -------------------------------------------------------------------------
# Inventory
# -------------------------------------------------------------------------
OP_MoveItem=0x2c21              # OP_MoveItem

# -------------------------------------------------------------------------
# XP / Level / Skills
# -------------------------------------------------------------------------
OP_ExpUpdate=0x9921             # OP_ExpUpdate
OP_LevelUpdate=0x9821           # OP_LevelUpdate
OP_SkillUpdate=0x8921           # OP_SkillUpdate

# -------------------------------------------------------------------------
# Groups
# -------------------------------------------------------------------------
OP_GroupUpdate=0x2640           # OP_GroupUpdate
OP_GroupInvite=0x4020           # OP_GroupInvite
OP_GroupFollow=0x4220           # OP_GroupFollow
OP_GroupDeclineInvite=0x4120    # OP_GroupDeclineInvite
OP_GroupQuit=0x4440             # OP_GroupQuit

# -------------------------------------------------------------------------
# Miscellaneous gameplay
# -------------------------------------------------------------------------
OP_Consume=0x5621               # OP_Consume (food/drink consumed)
OP_SetServerFilter=0xff21       # OP_SetServerFilter
OP_WhoAllRequest=0xf420         # OP_WhoAll (request from client)
OP_TradeSkillCombine=0x0521     # OP_TradeSkillCombine
OP_Consider=0x3721              # OP_Consider
OP_Stamina=0x5721               # OP_Stamina

# -------------------------------------------------------------------------
