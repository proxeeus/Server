# -------------------------------------------------------------------------
OP_ShopRequest=0x0b20           # OP_ShopRequest
OP_ShopPlayerBuy=0x2720         # OP_ShopPlayerBuy
OP_ShopPlayerSell=0x2820        # OP_ShopPlayerSell
OP_LootItem=0xa020              # OP_LootItem
OP_LootRequest=0x4e20           # OP_LootRequest
OP_LootComplete=0x4421          # OP_LootComplete
OP_DropItem=0x3520              # OP_DropItem
OP_PickupItem=0x3620            # OP_PickupItem

